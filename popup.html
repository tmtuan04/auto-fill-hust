<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Auto Fill HUST</title>
        <meta charset="UTF-8" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <style>
            html {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            body {
                width: 380px;
                background-color: #f8f9fa;
            }

            .content {
                background-color: white;
                padding: 20px;
                box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            }

            #statusBox {
                display: none;
                margin-top: 12px;
                font-size: 13px;
                white-space: pre-wrap;
                word-break: break-word;
            }

            #statusBox.is-ok {
                display: block;
            }

            #statusBox.is-partial {
                display: block;
            }

            #statusBox.is-error {
                display: block;
            }

            #statusDetail {
                max-height: 140px;
                overflow: auto;
                margin-top: 6px;
                font-size: 12px;
                color: #495057;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <h3 class="text-center fw-bold">
                Auto Fill: Quy chế kỳ 2026.1
            </h3>
            <p>
                <strong>Bước 1:</strong> Truy cập vào link bài thi tại đây
                <strong>(giữ Ctrl + click, hoặc click — mở tab mới)</strong>:
            </p>
            <ul>
                <li>
                    <strong>
                        Quy chế 2026.1:
                        <a
                            href="https://forms.cloud.microsoft/r/xrVqJ7e9Mr"
                            target="_blank"
                            rel="noopener noreferrer"
                            >Link bài thi</a
                        >
                    </strong>
                </li>
            </ul>
            <p>
                <strong>Bước 2:</strong> Sau khi truy cập vào link bài thi rồi
                thì ấn nút
                <strong>Fill Form</strong>
            </p>
            <button class="btn btn-success" id="fillForm" style="width: 100%">
                Fill Form
            </button>
            <div id="statusBox" class="alert mb-0" role="status"></div>
            <div id="statusDetail"></div>
            <p class="text-muted mt-3 mb-0" style="font-size: 12px">
                Nguồn đáp án tham khảo:
                <a
                    href="docs/kiem-tra-quy-che-2026.1.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                    >Kiểm tra quy chế kỳ 2026.1 (PDF)</a
                >
            </p>
        </div>
        <script src="scripts/popup.js"></script>
    </body>
</html>
